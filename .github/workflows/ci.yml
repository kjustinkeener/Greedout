# The frontend checks that can run without a person watching: the interface types,
# the translation catalogs and the component tests. The Rust tests run locally
# before a release, since compiling them on a clean runner takes minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows only, deliberately: the app reads a Windows-only transcript layout
    # and installs itself through Windows APIs. A green Linux build would be
    # telling us about code nobody runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24, not 20: the translation gate imports the catalogs as TypeScript
          # and relies on Node stripping the types, which older Node cannot do.
          node-version: 24
          cache: npm

      - run: npm ci

      # Types and translations. `check` is svelte-check plus the catalog gate,
      # which fails on a renamed key and warns on a missing one.
      - run: npm run check

      # Frontend unit + component tests (vitest/jsdom). Includes render guards
      # that fail if a keyed {#each} regresses to a non-unique key
      # (the each_key_duplicate crash that has bitten Daily Spend and the treemap).
      - run: npm run test

      - run: npm run build

  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
      - run: npm run test
      - run: npm run build
