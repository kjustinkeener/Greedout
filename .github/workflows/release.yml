# A published tag produces native, per-platform install artifacts. Windows keeps
# its self-installing executable; Linux receives a Debian package and a portable
# AppImage, both with a desktop entry and the bundled application icon.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as a draft release"
        required: false
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run release
      - name: Sign Windows executable
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandArgumentPassing = 'Standard'
          npx tauri signer sign --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" src-tauri/target/release/greedout.exe
      # The installed app polls releases/latest/download/update.json, so every
      # release must carry it. The signer emits base64 OF the signature file; the
      # app's verifier wants the file's text, so decode it once here.
      - name: Write the update manifest
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $exe = "src-tauri/target/release/greedout.exe"
          $sigB64 = (Get-Content "$exe.sig" -Raw).Trim()
          $minisig = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($sigB64))
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/greedout.exe"
          [ordered]@{ version = $tag.TrimStart("v"); notes = ""; url = $url; signature = $minisig } |
            ConvertTo-Json -Depth 3 | Set-Content -Path src-tauri/target/release/update.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/greedout.exe
            src-tauri/target/release/greedout.exe.sig
            src-tauri/target/release/update.json

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Tauri's Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Resolve release tag
        run: echo "TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: release/**/*
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          # Always a draft: the app only sees published releases, so nothing reaches
          # users until tools/verify-release has passed on the downloaded files.
          draft: true
